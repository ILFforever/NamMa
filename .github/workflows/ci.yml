name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: namma
          POSTGRES_PASSWORD: namma
          POSTGRES_DB: namma_test
        ports:
          - 5433:5432   # the port the tests default to (tests/conftest.py)
        options: >-
          --health-cmd "pg_isready -U namma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        # -rs lists skipped tests: a skip here means Postgres was not reachable, which should not happen in CI.
        run: python -m pytest -q -rs
